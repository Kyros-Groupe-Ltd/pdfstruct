[build-system]
requires = ["setuptools>=68.0,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfstructx"
version = "0.3.0"
description = "Intelligent PDF parser with font-aware structure detection, table extraction, and multi-column support"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Kyros Groupe"},
]
keywords = ["pdf", "parser", "document", "extraction", "tables", "structure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: General",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pdfminer.six>=20231228",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
documents = [
    "python-docx>=1.2,<2",
]
ocr = [
    "pypdfium2>=4.30.0",
    "rapidocr>=3.9.2,<4",
    "onnxruntime>=1.20,<2",
]
tesseract = [
    "pypdfium2>=4.30.0",
    "pytesseract>=0.3.13",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "reportlab>=4.0",
]

[project.urls]
Homepage = "https://github.com/Kyros-Groupe-Ltd/pdfstruct"
Documentation = "https://github.com/Kyros-Groupe-Ltd/pdfstruct#readme"
Issues = "https://github.com/Kyros-Groupe-Ltd/pdfstruct/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ocr_integration: requires local OCR engines and model assets"]

[tool.ruff]
line-length = 100
target-version = "py310"
